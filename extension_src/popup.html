<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLive</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;width:320px;min-height:420px;background:#0f0f0f;color:#f1f1f1;font-family:system-ui,sans-serif}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0f0f0f;z-index:10;transition:opacity .35s}
  #splash.hide{opacity:0;pointer-events:none}
  #splash img{width:72px;height:72px;border-radius:16px}
  #splash h1{font-size:1.15rem;margin:14px 0 4px}
  #splash .sub{color:#888;font-size:12px}
  .spin{width:22px;height:22px;border:2px solid #333;border-top-color:#e50914;border-radius:50%;
    animation:r 0.8s linear infinite;margin-top:16px}
  @keyframes r{to{transform:rotate(360deg)}}
  #app{padding:14px;display:none}
  #app.show{display:block}
  .card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:12px;margin:10px 0}
  .big{font-size:1.8rem;font-weight:800;color:#e50914}
  button{border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;background:#e50914;color:#fff;width:100%;margin-top:8px}
  button.sec{background:#222;border:1px solid #333}
  button:disabled{opacity:.45}
  .muted{color:#888;font-size:12px;line-height:1.4}
  input{width:100%;padding:8px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;margin:6px 0}
  h2{font-size:14px;margin:0 0 6px}
  #err{color:#f66;font-size:12px;margin-top:8px}
</style>
</head>
<body>
  <div id="splash">
    <img src="icons/icon-128.png" alt="">
    <h1 id="brand">StreamLive</h1>
    <div class="sub" id="splashSub">Проверка платформы…</div>
    <div class="spin" id="spinner"></div>
  </div>
  <div id="app">
    <h2>StreamLive</h2>
    <p class="muted" id="statusLine">—</p>
    <button type="button" id="open">Открыть платформу</button>
    <button type="button" class="sec" id="retry">Проверить сайт снова</button>
    <div class="card">
      <div class="muted">Монетки (только расширение)</div>
      <div class="big" id="bal">0</div>
      <div class="muted" id="claimInfo">+5 каждый день · 100 = промокод</div>
      <button type="button" id="claim">Забрать +5 сегодня</button>
    </div>
    <div class="card">
      <div class="muted">Обмен 100 монет → промокод (нужен username)</div>
      <input id="user" placeholder="username на сайте">
      <button type="button" id="exchange">Обменять</button>
      <div class="muted" id="exOut"></div>
    </div>
    <div id="err"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
