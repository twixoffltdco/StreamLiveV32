<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Платформа временно недоступна</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0f0f0f;color:#f1f1f1;font-family:system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-size:1.35rem;margin:0 0 10px}
  p{color:#a1a1aa;max-width:360px;line-height:1.5;margin:0 0 18px}
  button{border:0;border-radius:999px;padding:12px 20px;background:#e50914;color:#fff;font-weight:700;cursor:pointer}
</style>
</head>
<body>
  <div>
    <h1>Платформа временно недоступна</h1>
    <p>Пожалуйста, зайдите позже. Реклама хостинга здесь не показывается.</p>
    <button type="button" id="retry">Проверить снова</button>
  </div>
  <script>
    document.getElementById('retry').onclick = function () {
      location.href = chrome.runtime.getURL('splash.html');
    };
  </script>
</body>
</html>
