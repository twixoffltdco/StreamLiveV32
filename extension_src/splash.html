<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StreamLive</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:#0f0f0f;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif}
  img{width:96px;height:96px;border-radius:22px;box-shadow:0 12px 40px rgba(229,9,20,.25)}
  h1{font-size:1.6rem;margin:20px 0 6px;font-weight:800;letter-spacing:-.02em}
  .sub{color:#888;font-size:14px}
  .spin{width:28px;height:28px;border:3px solid #2a2a2a;border-top-color:#e50914;border-radius:50%;
    animation:r .75s linear infinite;margin-top:28px}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <img src="icons/icon-128.png" alt="StreamLive">
  <h1 id="brand">StreamLive</h1>
  <div class="sub" id="msg">Загрузка…</div>
  <div class="spin"></div>
  <script src="splash.js"></script>
</body>
</html>
