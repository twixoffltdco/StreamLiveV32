<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Монетки StreamLive</title>
<style>
  body{margin:0;background:#0f0f0f;color:#f1f1f1;font-family:system-ui,sans-serif;padding:20px;max-width:420px}
  h1{font-size:1.2rem;margin:0 0 8px}
  .card{background:#1a1a1a;border:1px solid #333;border-radius:14px;padding:14px;margin:12px 0}
  .big{font-size:2rem;font-weight:800;color:#e50914}
  button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:#e50914;color:#fff;margin:4px 4px 4px 0}
  button:disabled{opacity:.45;cursor:default}
  .muted{color:#888;font-size:13px;line-height:1.45}
  input{width:100%;padding:8px;border-radius:8px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box;margin:6px 0}
  code{background:#222;padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
  <h1>🪙 Монетки (только расширение)</h1>
  <p class="muted">Каждый день +5 монет. За 100 монет — личный промокод (один раз на аккаунт). На сайте монеток нет.</p>
  <div class="card">
    <div>Баланс</div>
    <div class="big" id="bal">0</div>
    <div class="muted" id="claimInfo">—</div>
    <button type="button" id="claim">Забрать +5 сегодня</button>
  </div>
  <div class="card">
    <div style="font-weight:700;margin-bottom:6px">Обмен на промокод</div>
    <p class="muted">Нужно 100 монет и логин на платформе (username). Промокод одноразовый.</p>
    <input id="user" placeholder="Ваш username на сайте" autocomplete="username">
    <button type="button" id="exchange">Обменять 100 → промокод</button>
    <div class="muted" id="exOut" style="margin-top:8px"></div>
  </div>
  <script src="coins.js"></script>
</body>
</html>
